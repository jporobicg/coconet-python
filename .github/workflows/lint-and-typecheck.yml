name: Lint, typecheck, and tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (including dev)
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check coconet coconet_assistant scripts tests app.py

      - name: Ruff format
        run: uv run ruff format --check coconet coconet_assistant scripts tests app.py

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
